name: Build and numerical verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Build native extension and install training dependencies
        run: uv sync --locked --extra train
      - name: Verify numerical and end-to-end behavior
        run: uv run --extra train pytest -q --junitxml=reports/junit.xml
      - name: Check formatting and static types
        run: |
          uv run --extra train ruff check .
          uv run --extra train ruff format --check .
          uv run --extra train mypy
      - name: Build distributable source and wheel
        run: uv build
